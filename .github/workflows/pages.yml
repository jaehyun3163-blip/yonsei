# index.html 을 올릴 때마다 부문포털용 읽기 전용 데이터(api/*.json)를 만들어 GitHub Pages 에 함께 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두어야 합니다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 파일 만들기
        run: python3 tools/build_api.py index.html _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 30초 기다리기
        run: sleep 30
      - name: 배포
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 실패하면 60초 더 기다리기
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - name: 다시 배포
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
