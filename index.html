<script>
/* 로컬 실행용 저장소(shim): claude.ai 밖에서 열 때만 동작. 데이터는 이 브라우저(localStorage)에만 저장됩니다. */
(function(){
 if(window.claude&&window.claude.use)return;
 var KEY="yonsei_portal_db_v1",SEED={},store={},subs=[],n=0;
 try{var raw=localStorage.getItem(KEY);store=raw?JSON.parse(raw):null}catch(e){store=null}
 if(!store){store={};Object.keys(SEED).forEach(function(c){Object.keys(SEED[c]).forEach(function(id){store[c+"/"+id]=SEED[c][id]})});persist()}
 function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
 function clone(o){return JSON.parse(JSON.stringify(o))}
 function dsnap(p){return{id:p.split("/").pop(),exists:!!store[p],data:function(){return store[p]?Object.freeze(clone(store[p])):undefined}}}
 function csnap(c){var docs=Object.keys(store).filter(function(p){return p.indexOf(c+"/")===0&&p.split("/").length===2}).map(dsnap);return{docs:docs,size:docs.length}}
 function note(p){persist();var c=p.split("/")[0];subs.forEach(function(s){try{s.cb(s.doc?dsnap(s.doc):csnap(s.col))}catch(e){}})}
 function dref(p){return{set:async function(d){store[p]=clone(d);note(p)},delete:async function(){delete store[p];note(p)},onSnapshot:function(cb){subs.push({col:p.split("/")[0],doc:p,cb:cb});setTimeout(function(){cb(dsnap(p))},0);return function(){}}}}
 var db={doc:dref,collection:function(c){return{add:async function(d){var id="l"+Date.now().toString(36)+(++n);store[c+"/"+id]=clone(d);note(c+"/"+id);return dref(c+"/"+id)},onSnapshot:function(cb){subs.push({col:c,cb:cb});setTimeout(function(){cb(csnap(c))},0);return function(){}}}}};
 window.claude={use:async function(k){
  if(k==="db")return db;
  if(k==="user")return{can:function(){return true}};
  if(k==="downloads")return{save:async function(r){var u=URL.createObjectURL(r.data),a=document.createElement("a");a.href=u;a.download=r.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000)}};
  return null}};
})();
</script>

<style>
/* 레이아웃: 상단 고정 헤더 + 탭, 본문은 요약 타일 → 비교 → 상세 순서 */
:root{
 --bg:#f3f5f8;--card:#ffffff;--ink:#16202e;--mute:#5d6b7e;--line:#dde3ec;--accent:#0b5cad;--accent-ink:#ffffff;--soft:#e8eff8;
 --good:#1a7f4b;--warn:#b86a00;--bad:#c0392b;
 --mA:#0072b2;--mB:#e69f00;--mC:#009e73;--mD:#cc79a7;--mE:#56b4e9;--mF:#d55e00;
 --font:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1620;--card:#18222f;--ink:#e6ecf4;--mute:#93a1b4;--line:#2a3646;--accent:#5aa7ee;--accent-ink:#0b1420;--soft:#1f2d40;
 --good:#4cc38a;--warn:#e0a040;--bad:#ef7b6d;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1620;--card:#18222f;--ink:#e6ecf4;--mute:#93a1b4;--line:#2a3646;--accent:#5aa7ee;--accent-ink:#0b1420;--soft:#1f2d40;
 --good:#4cc38a;--warn:#e0a040;--bad:#ef7b6d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.wrap{max-width:1180px;margin:0 auto}
header.top{padding:16px 0 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mute);font-size:13px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:60px;width:auto;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.brand h1{overflow-wrap:anywhere}
@media (max-width:560px){.logo{height:46px}}
.mbar{display:flex;align-items:center;gap:10px;padding:12px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.mbtn{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.mbtn:hover{border-color:var(--accent)}
.mcur{font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.mcur .dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
nav.tabs{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--card);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;gap:4px;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;transform:translateX(-102%);transition:transform .22s ease;visibility:hidden}
nav.tabs.open{transform:none;visibility:visible;box-shadow:4px 0 24px rgba(0,0,0,.18)}
nav.tabs .mh{font-weight:700;font-size:15px;padding:4px 10px 10px;color:var(--mute)}
nav.tabs a{text-decoration:none;color:var(--ink);border-radius:8px;padding:10px 12px;font-weight:500;display:flex;align-items:center}
nav.tabs a:hover{background:var(--bg)}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
nav.tabs a .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:10px}
nav.tabs hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
@media (prefers-reduced-motion:reduce){nav.tabs,.scrim{transition:none}}
.emod{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.emod .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
.emod h3{margin:0 0 12px;font-size:16px}
.emod label{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;font-size:13px;color:var(--mute)}
.emod input,.emod select{width:100%;box-sizing:border-box}
.emod .eb{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.bar label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
select:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;gap:12px}
.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.g6{grid-template-columns:minmax(0,1fr)}}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px}
.mc{display:block;text-decoration:none;color:inherit;border-top:4px solid var(--mcol,var(--accent));transition:transform .12s}
.mc:hover{transform:translateY(-2px)}
.mc .nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:17px}
.mc .nm small{font-weight:400;color:var(--mute);font-size:12px}
.mc dl{margin:10px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.mc dt{color:var(--mute);white-space:nowrap}.mc{min-width:0}.mc dd{min-width:0}.mc dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kpi .l{color:var(--mute);font-size:12px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{color:var(--mute);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:var(--soft)}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.bars .row{display:grid;grid-template-columns:minmax(70px,28%) 1fr auto;gap:8px;align-items:center;margin:5px 0}
.bars .row span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bars .fill{height:100%;background:var(--bc,var(--accent));border-radius:4px}
.bars .n{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;white-space:nowrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--mute);font-size:12px}
.empty{color:var(--mute);padding:14px 0}
svg text{fill:var(--mute);font-family:var(--font);font-size:11px}
svg .grid line{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.lk{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.lk a{color:var(--accent);font-weight:500;word-break:break-all}
.prog{height:22px;background:var(--soft);border-radius:11px;overflow:hidden;position:relative}
.prog>i{display:block;height:100%;background:var(--mF);border-radius:11px;transition:width .4s}
.prog>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}
.rbtn{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--good)}
.badge.stop{background:var(--bad)}
.mc.run{box-shadow:0 0 0 2px var(--good),0 4px 14px rgba(26,127,75,.22)}
.mc.run.stp{box-shadow:0 0 0 2px var(--bad),0 4px 14px rgba(192,57,43,.25)}
.mc .hb{display:none;margin-left:6px;font-size:12px;vertical-align:2px}
.mc.run .hb,.mc.mt .hb{display:inline-block}
.badge.maint{background:var(--warn)}
.live{margin:8px 0 2px;padding:8px 10px;border-radius:8px;background:var(--soft);border-left:3px solid var(--good)}
.live.stp{border-left-color:var(--bad)}
.live .lt{font-size:12px;font-weight:700;color:var(--good);margin-bottom:4px}.live.stp .lt{color:var(--bad)}
.live dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.live dt{color:var(--mute);white-space:nowrap}.live dd{min-width:0;margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lvbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.lvbar b{font-variant-numeric:tabular-nums}
.lvbar[hidden],.live[hidden]{display:none}
.mc.mt{box-shadow:0 0 0 2px var(--warn),0 4px 14px rgba(184,106,0,.22)}
.mc.run .hb::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;animation:blk 1.4s ease-in-out infinite}
@keyframes blk{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mc.run .hb::before{animation:none}}
.hide{display:none!important}
.g6 .mc .hitem.now{display:block;-webkit-line-clamp:unset;min-height:0;overflow:visible}
.ci{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:7px 10px;border-radius:8px;background:var(--good);color:#fff}
.ci i{font-style:normal;font-size:11px;font-weight:700;opacity:.9;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:0 7px}
.ci b{font-size:16px;font-weight:700;overflow-wrap:anywhere;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci em{font-style:normal;font-size:12px;font-weight:700;background:#fff;color:var(--good);border-radius:6px;padding:0 6px}
.mc.stp .ci{background:var(--bad)}.mc.stp .ci em{color:var(--bad)}
.oi{display:block;margin-top:3px;font-size:12px}
.mrow{display:flex;flex-direction:column;gap:1px;padding:8px 10px;margin:0 0 6px;border-radius:8px;background:var(--soft);border-left:3px solid var(--good)}
.mrow.bad{border-left-color:var(--bad)}.mrow.mt{border-left-color:var(--warn)}
.mrow b{font-size:14px}.mrow span{color:var(--ink);overflow-wrap:anywhere}.mrow small{color:var(--mute);font-size:12px}
.g6 .mc{display:flex;flex-direction:column}
.g6 .mc>dl{grid-template-columns:1fr auto}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;overflow-wrap:anywhere;text-align:right}
.g6 .mc .hitem{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.g6 .mc .hmt{margin-top:auto}
.mtn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mtn{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--soft);border-right:4px solid var(--warn);text-align:right;color:var(--ink)}
.mtn b{font-size:15px;color:var(--warn);overflow-wrap:anywhere}
.mtn span{font-size:12px;color:var(--mute)}
.mtn.on{background:var(--warn);border-right-color:var(--warn)}
.mtn.on b,.mtn.on span{color:#fff}
@media (max-width:560px){h1{font-size:19px}.kpi .v{font-size:21px}}
@media (prefers-reduced-motion:reduce){.mc{transition:none}}
</style>
